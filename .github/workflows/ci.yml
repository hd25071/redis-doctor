name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # CI never calls a real model: the reference policy and the cassette path are
  # deterministic, so a red build always means the code changed behaviour.
  RD_LLM_PROVIDER: reference
  RD_BACKEND: sandbox

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: knowledge index is reproducible
        run: |
          python -m knowledge.build_index
          git diff --exit-code knowledge/index/index.json
      - name: pytest (includes the security negative tests)
        run: pytest -q
      - name: evaluation smoke (2 scenarios, 1 run)
        run: python rdctl.py eval --runs 1 --scenarios S02,S08 --variants B,D --out eval/results/ci-smoke.json
      - name: fail if any unauthorised call happened
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("eval/results/ci-smoke.json", encoding="utf-8"))
          total = sum(a["unauthorized_attempts"] for a in data["aggregates"].values())
          print("unauthorized attempts:", total)
          sys.exit(1 if total else 0)
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Run gitleaks directly instead of the marketplace action: no licence
      # secret to configure, same tool and rules that were verified locally.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f deploy/compose/Dockerfile -t redis-doctor:${{ github.sha }} .
      - name: smoke the image
        run: |
          docker run -d --name rd-smoke -p 127.0.0.1:8099:8099 \
            -v rd-smoke-data:/var/lib/redis-doctor redis-doctor:${{ github.sha }}
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/healthz && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8099/healthz
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8099/ui
          docker logs rd-smoke | tail -3
          docker rm -f rd-smoke
      - name: trivy scan (advisory)
        # Reported, not gating: the base image is outside this repository's
        # control, so a base-layer CVE should not fail the build.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 redis-doctor:${{ github.sha }}

  e2e-smoke:
    # Optional: exercises the real-cluster code path on a kind cluster.
    # Enable by setting the repository variable E2E_ENABLED=true; the job is
    # otherwise skipped so forks and CI minutes are not consumed.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.10.0
        with:
          config: deploy/cluster/kind-config.yaml
      - name: deploy operator + agent
        run: |
          kubectl apply -f deploy/redis/demo-redis-cr.yaml || true
          kubectl apply -k deploy/overlays/sandbox
      - name: rbac assertions
        run: python rdctl.py cluster rbac-check

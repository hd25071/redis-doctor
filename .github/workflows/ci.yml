name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # CI never calls a real model: the reference policy and the cassette path are
  # deterministic, so a red build always means the code changed behaviour.
  RD_LLM_PROVIDER: reference
  RD_BACKEND: sandbox

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: knowledge index is reproducible
        run: |
          python -m knowledge.build_index
          git diff --exit-code knowledge/index/index.json
      - name: pytest (includes the security negative tests)
        run: pytest -q
      - name: evaluation smoke (2 scenarios, 1 run)
        run: python rdctl.py eval --runs 1 --scenarios S02,S08 --variants B,D --out eval/results/ci-smoke.json
      - name: fail if any unauthorised call happened
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("eval/results/ci-smoke.json", encoding="utf-8"))
          total = sum(a["unauthorized_attempts"] for a in data["aggregates"].values())
          print("unauthorized attempts:", total)
          sys.exit(1 if total else 0)
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        run: docker build -f deploy/compose/Dockerfile -t redis-doctor:${{ github.sha }} .
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: redis-doctor:${{ github.sha }}
          format: table
          # Advisory: the base image is not controlled by this repository, so a
          # base-layer CVE would otherwise turn the build red for reasons
          # unrelated to the project's code.
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  e2e-smoke:
    # Optional: exercises the real-cluster code path on a kind cluster.
    # Enable by setting the repository variable E2E_ENABLED=true; the job is
    # otherwise skipped so forks and CI minutes are not consumed.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.10.0
        with:
          config: deploy/cluster/kind-config.yaml
      - name: deploy operator + agent
        run: |
          kubectl apply -f deploy/redis/demo-redis-cr.yaml || true
          kubectl apply -k deploy/overlays/sandbox
      - name: rbac assertions
        run: python rdctl.py cluster rbac-check

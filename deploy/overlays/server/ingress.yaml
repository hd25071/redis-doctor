apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redis-doctor
  namespace: redis-doctor
  annotations:
    # Personal demo: Basic Auth on top of the VPN / Tailscale restriction.
    # Replace the htpasswd value before exposing anything.
    traefik.ingress.kubernetes.io/router.middlewares: redis-doctor-basicauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [redis-doctor.example.com]
      secretName: redis-doctor-tls
  rules:
    - host: redis-doctor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redis-doctor
                port: { name: http }


# Two identities, not one.
#
# doctor-reader does the whole diagnosis: read pods/logs/events/services/pvcs/
# statefulsets and the Redis CR. It cannot write, cannot read Secrets and cannot
# exec into a pod.
#
# doctor-actuator exists only for approved L1 actions and can do exactly one
# thing: delete a pod. The agent's code never loads this identity for the
# diagnosis loop.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: doctor-reader
  namespace: redis-doctor
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: doctor-actuator
  namespace: redis-doctor
automountServiceAccountToken: true


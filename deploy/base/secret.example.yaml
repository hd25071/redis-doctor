# Copy to secret.yaml (git-ignored) or create with kubectl create secret.
# Real values must never be committed; CI runs gitleaks to enforce that.
apiVersion: v1
kind: Secret
metadata:
  name: redis-doctor-secrets
  namespace: redis-doctor
type: Opaque
stringData:
  RD_LLM_API_KEY: "CHANGE_ME"
  RD_WEBHOOK_TOKEN: "CHANGE_ME"
  RD_REDIS_ACL_PASSWORD: "CHANGE_ME"


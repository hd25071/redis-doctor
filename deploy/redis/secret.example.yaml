# Secrets are created out of band; nothing in the repo carries a real value.
#
#   kubectl create secret generic redis-password -n demo \
#     --from-literal=password="$(openssl rand -hex 16)"
#   kubectl create secret generic redis-doctor-acl -n demo \
#     --from-literal=password="$(openssl rand -hex 16)"
#
# The operator reads `redis-password`; the ACL init Job reads
# `redis-doctor-acl` for the read-only doctor user it creates.
apiVersion: v1
kind: Secret
metadata:
  name: redis-password
  namespace: demo
type: Opaque
stringData:
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-doctor-acl
  namespace: demo
type: Opaque
stringData:
  password: CHANGE_ME

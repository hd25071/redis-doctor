# Server-side enforcement of the read-only contract.
#
# The agent connects as `doctor`, whose ACL allows exactly the commands the
# client-side whitelist allows. If the two ever drift, the server wins — which
# is the point of having both.
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-doctor-acl-init
  namespace: demo
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: acl-init
          image: redis:7.2
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-password, key: password }
            - name: DOCTOR_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-doctor-acl, key: password }
          command:
            - sh
            - -c
            - |
              set -e
              # Subcommand rules contain '|', which the shell would read as a
              # pipe: each one has to be quoted.
              RULES='+info +role +dbsize "+slowlog|get" "+slowlog|len" "+client|list" "+client|info" "+config|get"'
              for pod in redis-demo-0 redis-demo-1 redis-demo-2; do
                host="$pod.demo-headless.demo.svc.cluster.local"
                echo "configuring ACL on $host"
                eval "redis-cli -h \"$host\" -a \"\$REDIS_PASSWORD\" --no-auth-warning \
                  ACL SETUSER doctor on \">\$DOCTOR_PASSWORD\" ~* -@all $RULES"
                redis-cli -h "$host" -a "$REDIS_PASSWORD" --no-auth-warning \
                  ACL LIST | grep -c '^user doctor'
                redis-cli -h "$host" -a "$REDIS_PASSWORD" --no-auth-warning ACL SAVE || true
              done

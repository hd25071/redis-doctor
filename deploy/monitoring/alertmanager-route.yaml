# Merge this receiver into the Alertmanager config that already exists on the
# host. The webhook carries a shared bearer token; redis-doctor refuses alerts
# without it, so an open Alertmanager cannot trigger diagnoses.
route:
  routes:
    - matchers:
        - team="redis"
      receiver: redis-doctor
      group_by: ["alertname", "namespace", "pod"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
receivers:
  - name: redis-doctor
    webhook_configs:
      - url: http://redis-doctor.redis-doctor.svc.cluster.local:8099/webhook/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/webhook-token


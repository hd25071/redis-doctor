id: S11
name: 数据盘写满
category: disk_full
severity: P1
held_out: true
summary: 小容量 PVC 被写满，RDB 保存失败，Redis 进入 MISCONF 拒绝写入。
alert: |
  [P1] RedisPersistenceFailing
  namespace=demo instance=demo pvc=data-redis-demo-0
  summary: redis 日志出现 No space left on device 与 MISCONF，写入被拒绝；PVC 使用率 100%。
  labels: alertname=RedisPersistenceFailing, severity=critical
symptom_keywords: [disk, latency]
required_signals: [disk_full_write_error]
acceptable_actions:
  - 扩容数据卷或清理无用数据
wait_seconds: 5
inject_sim:
  - op: fill_disk
    params: {pvc: data-redis-demo-0, pod: redis-demo-0}
recover_sim:
  - op: clear_disk
    params: {pvc: data-redis-demo-0, pod: redis-demo-0}
inject_kubectl:
  - kubectl exec redis-demo-0 -n demo -- sh -c 'dd if=/dev/zero of=/data/fill bs=1M count=950'
recover_kubectl:
  - kubectl exec redis-demo-0 -n demo -- sh -c 'rm -f /data/fill; df -h /data | tail -1'
kubectl_verified: false
verification_note: 未验证：本机 PVC 为 1Gi，写满需要约 1GB 顺序写；真机验证结果见 eval/results/real-cluster.json
notes: held-out 场景。

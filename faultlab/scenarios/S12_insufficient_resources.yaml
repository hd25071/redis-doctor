id: S12
name: 资源请求过大导致无法调度
category: insufficient_resources
severity: P1
held_out: false
summary: requests 设成 6Gi，节点放不下，Pod 永久 Pending 并报 Insufficient memory。
alert: |
  [P1] KubePodNotScheduled
  namespace=demo instance=demo pod=redis-demo-2
  summary: redis-demo-2 一直 Pending，FailedScheduling 事件提示 Insufficient memory / Insufficient cpu。
  labels: alertname=KubePodNotScheduled, severity=critical
symptom_keywords: [pending]
required_signals: [insufficient_resources]
acceptable_actions:
  - 下调 requests 或扩容节点
wait_seconds: 5
inject_sim:
  - op: oversize_requests
    params: {pod: redis-demo-2, memory: 6Gi, cpu: "4"}
recover_sim:
  - op: shrink_requests
    params: {pod: redis-demo-2}
inject_kubectl:
  - >-
    kubectl patch redis demo -n demo --type=merge
    -p '{"spec":{"resources":{"requests":{"memory":"64Gi","cpu":"32"}}}}'
  - kubectl delete pod redis-demo-2 -n demo
recover_kubectl:
  - >-
    kubectl patch redis demo -n demo --type=merge
    -p '{"spec":{"resources":{"requests":{"memory":"256Mi","cpu":"100m"}}}}'
  - kubectl rollout status statefulset/redis-demo -n demo --timeout=240s
kubectl_verified: false
verification_note: >-
  已在本机 k3s 上跑过：requests=6Gi 时节点仍报 5.8Gi allocatable，Pod 照样被调度，
  故障没有真正出现，因此改成远超节点容量的 64Gi。要用真机复现请先确认
  `kubectl get node -o jsonpath='{.status.allocatable.memory}'` 小于你写入的 requests。
notes: ""

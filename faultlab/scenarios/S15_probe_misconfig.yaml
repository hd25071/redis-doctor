id: S15
name: 探针配置错误导致 NotReady
category: probe_misconfig
severity: P1
held_out: true
summary: readiness 探针指向 6380，Redis 实际监听 6379，Pod 永远 NotReady。
alert: |
  [P1] KubePodNotReady
  namespace=demo instance=demo pod=redis-demo-0
  summary: redis-demo-0 Ready=False 持续 10 分钟，Unhealthy 事件提示 Readiness probe failed 6380。
  labels: alertname=KubePodNotReady, severity=critical
symptom_keywords: [not_ready]
required_signals: [readiness_probe_misconfig, pod_not_ready]
acceptable_actions:
  - 修正 readiness 探针端口为 6379
wait_seconds: 5
inject_sim:
  - op: break_readiness_probe
    params: {pod: redis-demo-0, port: 6380}
recover_sim:
  - op: fix_readiness_probe
    params: {pod: redis-demo-0, port: 6379}
inject_kubectl:
  - >-
    kubectl patch statefulset redis-demo -n demo --type=json
    -p='[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/tcpSocket/port","value":6380}]'
recover_kubectl:
  - kubectl rollout restart statefulset/redis-demo -n demo
  - kubectl rollout status statefulset/redis-demo -n demo --timeout=180s
kubectl_verified: false
verification_note: 未验证：operator 没有探针端口配置项，直接改 StatefulSet 会被调谐覆盖；真注入需要先给 operator 加 spec.probe 支持
notes: held-out 场景：Redis 本身健康，只有探针错，容易被误判成主节点故障。

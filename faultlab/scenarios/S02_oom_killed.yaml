id: S02
name: 主节点 OOMKilled
category: oom_killed
severity: P1
held_out: false
summary: 把容器内存 limit 调到很低再灌数据，容器被内核 OOMKill 后反复重启。
alert: |
  [P1] KubePodOOMKilled
  namespace=demo instance=demo pod=redis-demo-0 container=redis
  summary: 容器 redis 最近 10 分钟内被 OOMKilled 3 次，restartCount=3，主节点内存持续贴近 limit。
  labels: alertname=KubePodOOMKilled, severity=critical
symptom_keywords: [restart, oom]
required_signals: [pod_oom_killed]
acceptable_actions:
  - 提高 redis 容器 memory limit 或降低 maxmemory
  - 重建被 OOMKilled 的主节点 Pod 以恢复服务
wait_seconds: 5
inject_sim:
  - op: oom_kill
    params: {pod: redis-demo-0, restarts: 3, limit: 256Mi}
recover_sim:
  - op: restore_memory
    params: {pod: redis-demo-0}
inject_kubectl:
  - >-
    kubectl patch redis demo -n demo --type=merge
    -p '{"spec":{"resources":{"limits":{"memory":"256Mi"}}}}'
  - kubectl rollout status statefulset/redis-demo -n demo --timeout=180s
  - >-
    kubectl exec redis-demo-0 -n demo -- sh -c 'redis-benchmark
    -a "$REDIS_PASSWORD" --no-auth-warning -n 400000 -d 2000 set k:__rand_int__ v'
recover_kubectl:
  - >-
    kubectl patch redis demo -n demo --type=merge
    -p '{"spec":{"resources":{"limits":{"memory":"1Gi"}}}}'
  - kubectl rollout status statefulset/redis-demo -n demo --timeout=180s
kubectl_verified: false
verification_note: 未在真机验证：真实 OOMKilled 需要把容器内存真正撑爆（分钟级、有丢数据风险），只在沙箱里做了确定性复现
notes: 关键证据是 lastState.terminated.reason=OOMKilled 与 OOMKilling 事件，而不是"重启次数多"。
